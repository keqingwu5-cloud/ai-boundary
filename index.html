<style>
:root{--glass:rgba(14,18,40,.58);--line:rgba(160,180,255,.16);--text:#eef0ff;--muted:#8f98c4;--gold:#f5c451;--glow:#9db7ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#03040b;color:var(--text);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
button{font-family:inherit;color:inherit}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);box-shadow:0 0 30px rgba(110,130,255,.1),inset 0 1px 0 rgba(255,255,255,.06)}
.bar{position:fixed;top:10px;left:10px;right:10px;z-index:30;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-radius:18px}
.bar h1{margin:0;font-size:15px;font-weight:900;white-space:nowrap;letter-spacing:1px;text-shadow:0 0 12px rgba(170,150,255,.7)}
.bar h1 span{background:linear-gradient(90deg,#b9cbff,#d5b4ff,#ffe2a0);-webkit-background-clip:text;background-clip:text;color:transparent}
#crumbs{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
#crumbs::-webkit-scrollbar{display:none}
#crumbs button{flex:none;border:1px solid color-mix(in srgb,var(--c) 50%,transparent);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer}
#crumbs i{color:var(--muted);font-style:normal}
.tools{display:flex;gap:5px;flex:none}
.ib{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;font-size:15px;display:grid;place-items:center;transition:.2s;position:relative}
.ib:hover{border-color:var(--glow);box-shadow:0 0 14px rgba(157,183,255,.55)}
.ib.gold{border-color:rgba(245,196,81,.6);color:var(--gold);box-shadow:0 0 12px rgba(245,196,81,.25)}
.ib.on{background:rgba(157,183,255,.18);border-color:var(--glow)}
.ib sup{position:absolute;top:-4px;right:-4px;font-size:9px;background:#2b3370;border-radius:99px;padding:0 4px;line-height:14px}
.hide{display:none!important}
body.linking #bLink{background:rgba(245,196,81,.25);border-color:var(--gold);box-shadow:0 0 16px rgba(245,196,81,.6)}
body.linking #c{cursor:crosshair}
.ctl{position:fixed;left:12px;bottom:12px;z-index:20;display:flex;flex-direction:column;gap:7px}
#legend{position:fixed;right:12px;bottom:12px;z-index:20;display:flex;gap:5px;align-items:center;padding:5px 8px;border-radius:99px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 80px)}
#legend button{border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:transparent;border-radius:99px;padding:2px 7px;font-size:12px;cursor:pointer;display:flex;gap:3px;align-items:center}
#legend button i{font-style:normal;font-size:10px;color:var(--muted)}
#legend button.on{background:color-mix(in srgb,var(--c) 30%,transparent);box-shadow:0 0 10px var(--c)}
#legend .meta{font-size:11px;color:var(--muted);padding:0 4px}
#hint{position:fixed;left:58px;bottom:16px;z-index:20;font-size:11.5px;color:var(--muted);border-radius:99px;padding:5px 12px;transition:opacity 1.2s;pointer-events:none}
#hint.off{opacity:0}
#saved{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:35;font-size:11px;color:#9fe3b5;opacity:0;transition:opacity .4s;pointer-events:none}
#saved.on{opacity:.9}
#toast{position:fixed;top:72px;left:50%;transform:translate(-50%,-8px);z-index:60;padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.3s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:10}
.blabel{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;font-size:12px;padding:3px 10px;border-radius:99px;white-space:nowrap;background:rgba(10,12,30,.6);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);color:#fff;box-shadow:0 0 12px color-mix(in srgb,var(--c) 40%,transparent);transition:opacity .3s}
.blabel:empty{display:none}
#nlabel{position:fixed;left:0;top:0;z-index:11;pointer-events:none;max-width:240px;font-size:12px;line-height:1.35;padding:4px 10px;border-radius:10px;background:rgba(8,10,26,.78);border:1px solid color-mix(in srgb,var(--c) 60%,transparent);text-shadow:0 0 6px #000;opacity:0;transition:opacity .2s}
/* panel */
#panel{position:fixed;z-index:40;overflow:auto;right:10px;top:66px;bottom:10px;width:370px;padding:16px 16px 24px;border-radius:20px;transform:translateX(112%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#panel.open{transform:none}
#pX{position:sticky;top:0;float:right;margin:-4px -4px 0 6px;z-index:2}
.row1{display:flex;flex-wrap:wrap;gap:5px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 9px;color:color-mix(in srgb,var(--c,#9db7ff) 50%,#fff);background:color-mix(in srgb,var(--c,#9db7ff) 14%,transparent);border:1px solid color-mix(in srgb,var(--c,#9db7ff) 45%,transparent)}
.tag.by.merlin{--c:#f5c451}.tag.by.bot{--c:#5fd4ff}.tag.kind{--c:#8f98c4}
#panel h2{font-size:18px;line-height:1.45;margin:8px 0 6px;text-shadow:0 0 14px rgba(160,170,255,.35)}
.one{font-size:13.5px;color:#d5daf7;margin:0 0 10px}
.one:before{content:"✦ ";color:var(--gold)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.acts button,.status button{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:99px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.acts button:hover{border-color:var(--glow);box-shadow:0 0 10px rgba(157,183,255,.4)}
.acts .danger{color:#ff9a9a}
.status{display:flex;gap:4px;margin-bottom:10px}
.status button{font-size:11.5px;padding:3px 9px;color:var(--muted)}
.status button.on{color:#fff;border-color:#7fe0a8;background:rgba(127,224,168,.15);box-shadow:0 0 10px rgba(127,224,168,.35)}
.src{font-size:12.5px;color:var(--muted);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:10px}
.src a,.nl{color:#a9c1ff;text-decoration:none}
.prov{display:grid;gap:5px;font-size:12.5px;margin-bottom:6px}
.prov>div{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.prov span{color:var(--muted);font-size:11.5px;margin-right:2px}
.prov .nl{border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:8px;padding:1px 7px;color:#dfe5ff;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prov em{color:var(--muted);font-style:normal;font-size:11.5px}
.lbl{font-size:11.5px;color:var(--muted);font-weight:700;margin:14px 0 7px;letter-spacing:1px}
.lbl i{font-style:normal;background:rgba(255,255,255,.08);border-radius:99px;padding:0 6px}
.txt{font-size:13px;margin:0;color:#d7dbf3}
.steps{display:grid;gap:6px}
.st{display:grid;grid-template-columns:82px 1fr;gap:8px;font-size:12.5px}
.st b{border:1px solid rgba(157,183,255,.4);border-radius:99px;text-align:center;font-size:11px;padding:2px 4px;height:fit-content;color:#cfd9ff}
.ce{display:grid;gap:5px}
.flow{display:grid;gap:5px}
.fl{border:1px solid rgba(157,183,255,.18);border-radius:12px;background:rgba(255,255,255,.025);padding:0 10px}
.fl summary{cursor:pointer;list-style:none;font-size:12.5px;padding:7px 0;color:#cfd9ff;display:flex;align-items:center;gap:6px}
.fl summary::-webkit-details-marker{display:none}
.fl summary:after{content:"▸";margin-left:auto;color:var(--muted);transition:transform .2s}
.fl[open] summary:after{transform:rotate(90deg)}
.fl p,.fl li{font-size:12.5px;line-height:1.65;color:#d7dbf3;margin:0 0 6px}
.fl ol{margin:0 0 6px;padding-left:20px}
.vw{display:grid;gap:6px;padding-bottom:8px}
.v{border-left:2px solid rgba(157,183,255,.45);padding:2px 0 2px 8px}
.v b{font-size:12px;color:#fff}
.v p{margin:2px 0 3px}
.cs{font-size:11.5px;margin-top:3px;color:var(--muted);line-height:1.5}
.cs a{color:#b9c8ff;text-decoration:none}
.cs small{display:block;font-size:10.5px;color:#7f88b3}
.ci > div{min-width:0;line-height:1.6}
.ag{display:inline-block;font-weight:500;font-size:10.5px;color:#ffb4b4;border:1px solid rgba(255,140,140,.35);border-radius:99px;padding:0 6px;margin:0 5px 2px 0}
em.spec{font-style:normal;font-size:10.5px;color:#ffe08a;border:1px dashed rgba(255,224,138,.6);border-radius:6px;padding:0 4px;margin:0 2px;white-space:nowrap}
.lbl i.by{font-style:normal;font-size:10.5px;color:var(--muted);margin-left:4px}
.ci{font-size:12.5px;background:rgba(255,120,120,.07);border:1px solid rgba(255,140,140,.2);border-radius:10px;padding:6px 9px;display:flex;gap:6px}
.empty{font-size:12px;color:var(--muted)}
#ceF{display:flex;gap:5px}
#ceF input{flex:1;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:99px;color:var(--text);padding:6px 11px;font-size:12.5px;font-family:inherit}
#ceF button{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:50%;width:30px;cursor:pointer}
.media{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{position:relative;border:1px dashed rgba(160,180,255,.3);border-radius:12px;height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:11.5px;overflow:hidden;background:rgba(0,0,0,.2)}
.slot a{color:#dbe6ff;text-decoration:none;display:flex;flex-direction:column;align-items:center;width:100%;height:100%;justify-content:center}
.slot.has{border-style:solid;border-color:rgba(157,183,255,.5)}
.slot img{width:100%;height:100%;object-fit:cover}
.slot .mini{position:absolute;top:3px;right:3px;border:none;background:rgba(0,0,0,.4);border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;color:var(--muted)}
.mh{font-size:11.5px;color:var(--muted);display:grid;gap:2px}
/* history drawer */
#hist{position:fixed;z-index:41;left:10px;top:66px;bottom:10px;width:320px;border-radius:20px;padding:14px;display:flex;flex-direction:column;transform:translateX(-112%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#hist.open{transform:none}
#hist header{display:flex;align-items:center;gap:6px;margin-bottom:8px}
#hist header h3{margin:0;font-size:14px;flex:1}
#hList{overflow:auto;display:grid;gap:4px;align-content:start;flex:1;position:relative;padding-left:10px;border-left:1px solid rgba(157,183,255,.2)}
.hi{font-size:12px;display:grid;grid-template-columns:72px 1fr;gap:2px 6px;padding:5px 6px;border-radius:8px;position:relative}
.hi:before{content:"";position:absolute;left:-14px;top:10px;width:7px;height:7px;border-radius:50%;background:#9db7ff;box-shadow:0 0 8px #9db7ff}
.hi[data-n]{cursor:pointer}.hi[data-n]:hover{background:rgba(255,255,255,.06)}
.hi time{color:var(--muted);font-size:11px}.hi span{grid-column:2;color:#c9d0f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hfoot{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.hfoot button{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:99px;padding:5px 11px;font-size:12px;cursor:pointer}
/* dialogs */
dialog{background:rgba(14,18,40,.94);color:var(--text);border:1px solid var(--line);border-radius:20px;width:min(470px,92vw);padding:18px;box-shadow:0 0 50px rgba(120,140,255,.22)}
dialog::backdrop{background:rgba(0,0,8,.7);backdrop-filter:blur(3px)}
dialog h3{margin:0 0 4px;font-size:16px}
dialog .sub{font-size:12px;color:var(--muted)}
dialog label{display:block;font-size:12px;color:var(--muted);margin:9px 0 4px}
dialog input,dialog select,dialog textarea{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px;font-family:inherit;font-size:14px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
dialog .row button{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:99px;padding:7px 14px;cursor:pointer}
dialog .row .go{border-color:rgba(245,196,81,.6);color:var(--gold);box-shadow:0 0 12px rgba(245,196,81,.25)}
@media (max-width:700px){
  .bar{top:8px;left:8px;right:8px;flex-wrap:wrap;padding:6px 6px 6px 12px;gap:6px}
  .bar h1{font-size:14px}
  #crumbs{order:3;flex-basis:100%}
  .tools{margin-left:auto}
  .ib{width:31px;height:31px;font-size:13px}
  #panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:58vh;transform:translateY(115%)}
  #hist{left:8px;right:8px;width:auto;top:100px}
  #legend{bottom:10px;right:8px;max-width:calc(100% - 64px)}
  #legend .meta{display:none}
  #hint{display:none}
  #saved,#toast{top:104px}
}

/* concept layer */
#cdraw{position:fixed;z-index:39;left:10px;top:66px;width:270px;max-height:calc(100% - 140px);border-radius:20px;padding:12px;display:flex;flex-direction:column;transform:translateX(-112%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#cdraw.open{transform:none}
#cdraw header{display:flex;align-items:center;gap:6px;margin-bottom:6px}
#cdraw h3{margin:0;font-size:14px;flex:1}
.tog{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:99px;padding:3px 10px;font-size:11.5px;cursor:pointer;color:var(--muted)}
.tog.on{color:#9fe3b5;border-color:rgba(127,224,168,.5)}
#cList{overflow:auto;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.csec{flex-basis:100%;font-size:11px;color:var(--muted);margin:6px 0 2px;letter-spacing:1px}
.cchip{display:inline-flex;align-items:center;gap:5px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:rgba(255,255,255,.03);border-radius:99px;padding:3px 9px 3px 7px;font-size:12px;cursor:pointer}
.cchip i{width:14px;height:3px;border-radius:2px;background:var(--c);box-shadow:0 0 8px var(--c)}
.cchip b{font-weight:400;font-size:10px;color:var(--muted)}
.cchip.on{background:color-mix(in srgb,var(--c) 25%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent);color:#fff}
.cchip.solo{opacity:.55}
#cpill{position:fixed;z-index:34;top:66px;left:50%;transform:translate(-50%,-10px);display:flex;align-items:center;gap:7px;padding:5px 6px 5px 12px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;border-color:color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--c) 40%,transparent)}
#cpill.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#cpill i{width:16px;height:3px;border-radius:2px;background:var(--c);box-shadow:0 0 8px var(--c)}
#cpill b{font-weight:400;font-size:11px;color:var(--muted)}
#cpill button{border:none;background:rgba(255,255,255,.08);border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:11px}
.cchips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.cc{display:inline-flex;align-items:center;border:1px solid color-mix(in srgb,var(--c) 50%,transparent);border-radius:99px;overflow:hidden;font-size:12px}
.cc button{border:none;background:transparent;padding:3px 4px 3px 9px;cursor:pointer;font-size:12px}
.cc button+button{padding:3px 8px 3px 3px;color:var(--muted)}
.cc:before{content:"";width:3px;align-self:stretch;background:var(--c);box-shadow:0 0 6px var(--c)}
.cc.on{background:color-mix(in srgb,var(--c) 25%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--c) 50%,transparent)}
#ccF input{width:92px;background:rgba(0,0,0,.3);border:1px dashed var(--line);border-radius:99px;color:var(--text);padding:3px 10px;font-size:12px;font-family:inherit}
.pat{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.pat select{background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--text);border-radius:99px;padding:3px 8px;font-size:12px;font-family:inherit;max-width:170px}
.pf{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:99px;padding:2px 9px;font-size:11.5px;cursor:pointer}
.pf.on{border-color:#fff;box-shadow:0 0 10px rgba(255,255,255,.4)}
.sugg{display:flex;flex-wrap:wrap;gap:5px;min-height:26px}
.cc1{border:1px dashed color-mix(in srgb,var(--c) 60%,transparent);background:transparent;border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer}
.cc1.on{border-style:solid;background:color-mix(in srgb,var(--c) 25%,transparent);color:#fff}
.skind{display:flex;gap:8px;margin-top:10px}
.skind label{margin:0;flex:1}
.skind input{display:none}
.skind span{display:block;text-align:center;border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;color:var(--text);font-size:14px}
.skind input:checked+span{border-color:#ff7ae0;background:rgba(255,122,224,.12);box-shadow:0 0 12px rgba(255,122,224,.35)}
.skind label:first-child input:checked+span{border-color:#7fe0a8;background:rgba(127,224,168,.12);box-shadow:0 0 12px rgba(127,224,168,.3)}
.tag.kind.direction{--c:#ff7ae0}
@media (max-width:700px){
  #cdraw{left:8px;right:8px;width:auto;top:auto;bottom:58px;max-height:44vh;transform:translateY(130%)}
  #cpill{top:104px}
}

a.ib{display:inline-grid;place-items:center;text-decoration:none;color:inherit}
.vbox{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.vbox video{width:100%;max-height:260px;border-radius:12px;background:#000;object-fit:contain}
.vext{font-size:12.5px}
#mvF{display:flex;gap:6px}
#mvF input{flex:1;min-width:0;background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 9px;font-size:12.5px;font-family:inherit}
#mvF button{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:10px;padding:0 10px;cursor:pointer}
.tofeed{font-size:12.5px;color:#ffb3ef;text-decoration:none}
</style>

<body>
<canvas id="c"></canvas>
<div id="labels"></div><div id="nlabel"></div>
<header class="bar glass">
  <h1>🧠 <span>認知大腦</span></h1>
  <nav id="crumbs"></nav>
  <div class="tools">
    <button class="ib gold" id="bAdd" title="新增問題（長出新神經節點）">＋</button>
    <a class="ib" id="bFeed" href="feed.html" title="短影音模式">📱</a>
    <a class="ib" id="bAudioLab" href="./audio-lab.html" title="日文轉場音實驗室：50 組可播放、盲聽與主腦同步">🎧</a>
    <button class="ib on" id="bConc" title="概念線">🧵</button>
    <button class="ib" id="bLink" title="跨腦連結模式">🔗</button>
    <button class="ib" id="bUndo" title="復原">↶</button>
    <button class="ib" id="bHist" title="歷史紀錄">🕘<sup id="hCount">0</sup></button>
  </div>
</header>
<div class="ctl">
  <button class="ib glass" id="bFit" title="總覽全部腦">◎</button>
  <button class="ib glass" id="bHome" title="回到主腦">⌂</button>
  <button class="ib glass on" id="bRot" title="自動旋轉">⟳</button>
</div>
<div id="hint" class="glass">拖曳旋轉・滾輪／雙指縮放・點節點</div>
<div id="legend" class="glass"></div>
<div id="saved">● 已自動儲存</div>
<div id="cpill" class="glass"></div>
<aside id="cdraw" class="glass">
  <header><h3>🧵 概念線</h3><button id="cOn" class="tog on">● 顯示</button><button class="ib" id="cX" title="關閉">✕</button></header>
  <div id="cList"></div>
</aside>
<div id="toast" class="glass"></div>
<aside id="panel" class="glass"><button class="ib" id="pX" title="關閉">✕</button><div id="pBody"></div></aside>
<aside id="hist" class="glass">
  <header><h3>🕘 生長紀錄</h3><button class="ib" id="hX" title="關閉">✕</button></header>
  <div id="hList"></div>
  <div class="hfoot"><button id="bExport">⇩ 匯出 JSON</button><button id="bImport">⇧ 匯入</button><button id="bReset">↺ 重置</button></div>
  <input type="file" id="file" accept="application/json,.json" hidden>
</aside>
<dialog id="addDlg"><form method="dialog" id="addForm">
  <h3>✦ 新問題</h3><div class="sub">長在：<b id="addWhere"></b></div>
  <label>問題</label><input name="qtitle" required maxlength="80">
  <label>類型</label><select name="qtype" id="qType"></select>
  <label>一句話：真正在問什麼？</label><input name="oneLiner" maxlength="120">
  <label>前提假設</label><input name="assume" maxlength="200">
  <label>延伸問題（每行一題，可加「｜類型」）</label><textarea name="exts" rows="3"></textarea>
  <label>🧵 概念（點選採用建議）</label><div id="sugg" class="sugg"></div>
  <input name="cextra" placeholder="其他概念，用逗號分隔" maxlength="80" style="margin-top:6px">
  <label>來源 / 網址（選填）</label><div style="display:flex;gap:6px"><input name="src" placeholder="人名／媒體"><input name="url" type="url" placeholder="https://"></div>
  <div class="row"><button value="cancel" formnovalidate>取消</button><button value="ok" class="go">長出節點 ✦</button></div>
</form></dialog>
<dialog id="splitDlg"><form method="dialog" id="splitForm">
  <h3>❖ 分裂節點</h3><div class="sub" id="splitOf"></div>
  <div class="skind"><label><input type="radio" name="skind" value="extension" checked><span>🌿 子問題</span></label><label><input type="radio" name="skind" value="direction"><span>🚀 新方向</span></label></div>
  <label>每行一個（可加「｜類型」）</label><textarea name="lines" rows="4" required></textarea>
  <div class="row"><button value="cancel" formnovalidate>取消</button><button value="ok" class="go">分裂 ❖</button></div>
</form></dialog>
