<style>
:root{
  --bg:#0f1220; --panel:#171b2e; --panel2:#1e2340; --line:#2c3358;
  --text:#e8eaf6; --muted:#9aa3c7; --gold:#f5c451; --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  background:radial-gradient(1200px 600px at 10% -10%,#2a2160 0,transparent 60%),radial-gradient(900px 500px at 110% 0,#123a4a 0,transparent 55%),var(--bg);
  color:var(--text);line-height:1.55;min-height:100vh}
a{color:#8fb4ff}
.wrap{max-width:1200px;margin:0 auto;padding:28px 22px 60px}
/* header */
header.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:stretch;margin-bottom:22px}
.brand h1{font-size:34px;font-weight:900;margin:0 0 6px;letter-spacing:1px}
.brand h1 span{background:linear-gradient(90deg,#8fb4ff,#c18bff,#f5c451);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:0;color:var(--muted);font-size:15px}
.brand .stats{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:96px}
.stat b{display:block;font-size:24px;font-weight:900}
.stat small{color:var(--muted);font-size:12px}
.summary{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.summary h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:500}
.barrow{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;margin:7px 0;font-size:13px;cursor:pointer}
.barrow:hover .bar{filter:brightness(1.2)}
.track{background:#0c0f1c;border-radius:99px;height:14px;overflow:hidden;display:flex}
.bar{height:100%}
.bar.ext{opacity:.4}
.barrow .n{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:#8fb4ff;margin-right:4px;vertical-align:-1px}
.legend i.l{opacity:.4}
/* filter */
.filters{position:sticky;top:0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;padding:12px 0;margin-bottom:6px;
  background:linear-gradient(var(--bg) 70%,transparent)}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:99px;padding:7px 14px;font-size:13px;cursor:pointer;
  display:inline-flex;gap:6px;align-items:center;font-family:inherit;transition:.15s}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip .c{background:#0c0f1c;border-radius:99px;padding:0 7px;font-size:11px;color:var(--muted)}
.chip.on{background:var(--c,#3b4170);border-color:var(--c,#8fb4ff);color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--c,#8fb4ff) 25%,transparent)}
.chip.on .c{background:rgba(0,0,0,.25);color:#fff}
.tools{margin-left:auto;display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.btn.gold{border-color:var(--gold);color:var(--gold)}
/* section titles */
h2.sec{font-size:18px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec small{color:var(--muted);font-weight:400;font-size:13px}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;
  border-top:4px solid var(--c);transition:transform .15s, box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card .top{padding:14px 16px 10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.tag{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);white-space:nowrap}
.badge-user{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--gold);color:#2a1d00}
.idn{margin-left:auto;font-size:11px;color:var(--muted)}
.card h4{margin:0 0 6px;font-size:18px;line-height:1.35}
.one{margin:0;color:#cfd5f5;font-size:14px;display:flex;gap:6px}
.one::before{content:"💡";flex:none}
.src{font-size:12px;color:var(--muted);margin-top:10px;display:flex;gap:6px;align-items:flex-start}
.src a{color:#8fb4ff;text-decoration:none}
.src a:hover{text-decoration:underline}
.mini-ext{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px}
.mini-ext span{width:22px;height:6px;border-radius:99px;background:var(--c)}
.toggle{border:none;border-top:1px solid var(--line);background:var(--panel2);color:var(--muted);padding:10px;cursor:pointer;font-family:inherit;font-size:13px;margin-top:auto}
.toggle:hover{color:#fff}
.details{display:none;padding:14px 16px 16px;border-top:1px solid var(--line);background:#141831}
.card.open .details{display:block}
.label{font-size:12px;color:var(--muted);margin:0 0 8px;font-weight:700;letter-spacing:.5px}
/* process stepper */
.steps{display:grid;gap:8px;margin-bottom:14px;counter-reset:s}
.step{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:start;font-size:13px}
.step .k{background:var(--sc);color:#0d1020;font-weight:900;border-radius:8px;padding:4px 8px;text-align:center;font-size:12px;position:relative}
.step:not(:last-child) .k::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:12px;background:var(--line)}
.step .v{color:#d7dbf3}
/* extensions list */
.exts{display:grid;gap:6px;margin-bottom:14px}
.ext{display:flex;gap:8px;align-items:center;font-size:13.5px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:7px 10px}
.ext .arrow{color:var(--muted)}
.ext .tag{margin-left:auto}
/* media */
.media{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{border:1.5px dashed var(--line);border-radius:10px;height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:12px;gap:2px;text-decoration:none;overflow:hidden}
.slot b{font-size:20px}
.slot.has{border-style:solid;border-color:#3b4a8a;color:#cfe0ff;background:#1a2147}
.slot img{width:100%;height:100%;object-fit:cover}
.also{font-size:12px;margin-top:6px}
/* tree */
.tree{display:grid;gap:14px}
.branch{display:grid;grid-template-columns:300px 1fr;gap:0;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.root{background:color-mix(in srgb,var(--c) 22%,#151a33);border:1.5px solid var(--c);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;position:relative;cursor:pointer}
.root small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:3px}
.root::after{content:"";position:absolute;right:-28px;top:50%;width:28px;height:2px;background:var(--c)}
.leaves{margin-left:28px;border-left:2px solid var(--c);padding-left:0;display:grid;gap:6px}
.leaf{position:relative;margin-left:22px;font-size:13px;background:#141831;border:1px solid var(--line);border-radius:9px;padding:6px 10px;display:flex;gap:8px;align-items:center}
.leaf::before{content:"";position:absolute;left:-24px;top:50%;width:22px;height:2px;background:var(--lc)}
.leaf .d{width:8px;height:8px;border-radius:50%;background:var(--lc);flex:none}
.leaf .t{margin-left:auto;font-size:11px;color:var(--lc);white-space:nowrap}
.hidden{display:none!important}
.empty{color:var(--muted);text-align:center;padding:30px;border:1px dashed var(--line);border-radius:var(--radius)}
/* add dialog */
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;width:min(520px,92vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
dialog input,dialog select,dialog textarea{width:100%;background:#0f1328;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px;font-family:inherit;font-size:14px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
footer{color:var(--muted);font-size:12px;margin-top:36px;text-align:center}
@media (max-width:860px){header.hero{grid-template-columns:1fr}.branch{grid-template-columns:1fr}.root::after{display:none}.leaves{margin:10px 0 0 10px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="brand">
      <h1>🔮 <span>AI 認知邊界</span> 問題鏈</h1>
      <p>把公開討論中的關鍵提問，拆成「主問題 → 延伸問題」，並標註問題類型。點卡片看推演流程。</p>
      <div class="stats" id="stats"></div>
    </div>
    <div class="summary">
      <h3>📊 各類型問題數量</h3>
      <div id="bars"></div>
      <div class="legend"><span><i></i>主問題</span><span><i class="l"></i>延伸問題</span><span>點一列可直接篩選</span></div>
    </div>
  </header>

  <nav class="filters" id="filters"></nav>

  <h2 class="sec">🗂️ 問題卡片 <small id="shown"></small></h2>
  <div class="grid" id="grid"></div>

  <h2 class="sec">🌳 問題鏈地圖 <small>主問題 → 延伸問題（顏色＝類型）</small></h2>
  <div class="tree" id="tree"></div>

  <footer>內容為公開訪談／文章之摘要改寫，非逐字引述；請以原始來源為準。資料更新：2026-10-10</footer>
</div>

<dialog id="addDlg">
  <form method="dialog" id="addForm">
    <h3 style="margin:0 0 4px">✍️ 新增我的問題</h3>
    <div style="font-size:12px;color:var(--muted)">儲存在這台瀏覽器（localStorage），會顯示「Merlin 自填」徽章。</div>
    <label>問題（短句）</label><input name="title" required maxlength="60">
    <label>類型</label><select name="type" id="typeSel"></select>
    <label>一句話：這個問題真正在問什麼？</label><input name="oneLiner" maxlength="100">
    <label>延伸問題（每行一題，可在行尾加「｜類型」）</label><textarea name="exts" rows="3" placeholder="例：AI 會有直覺嗎？｜理解與意識"></textarea>
    <label>來源（選填）</label><input name="src" placeholder="人名／媒體／日期">
    <label>來源網址（選填）</label><input name="url" type="url">
    <div class="row"><button class="btn" value="cancel" formnovalidate>取消</button><button class="btn gold" value="ok">加入</button></div>
  </form>
</dialog>

<script>
(function(){
  const STORE = "aiBoundary.userQuestions.v1";
  let userQs = [];
  try { userQs = JSON.parse(localStorage.getItem(STORE) || "[]"); } catch(e){ userQs = []; }
  const all = () => QUESTIONS.concat(userQs);
  const T = t => TYPES[t] || TYPES["其他"];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const STEP_COLORS = {"問題定義":"#8fb4ff","前提":"#c18bff","推演":"#f5c451","未解關鍵點":"#ff8a8a"};
  let active = "全部";
  const tag = t => `<span class="tag" style="--c:${T(t).color}">${T(t).icon} ${esc(t)}</span>`;

  function counts(){
    const c = {};
    Object.keys(TYPES).forEach(k => c[k] = {main:0, ext:0});
    all().forEach(q => {
      (c[q.type] ||= {main:0,ext:0}).main++;
      (q.extensions||[]).forEach(e => (c[e.type] ||= {main:0,ext:0}).ext++);
    });
    return c;
  }

  function renderHeader(){
    const qs = all(), c = counts();
    const nExt = qs.reduce((a,q)=>a+(q.extensions||[]).length,0);
    const nSrc = new Set(qs.filter(q=>q.source&&q.source.url).map(q=>q.source.url)).size;
    document.getElementById("stats").innerHTML = [
      [qs.length,"主問題"],[nExt,"延伸問題"],[nSrc,"公開來源"],[userQs.length,"Merlin 自填"]
    ].map(([n,l])=>`<div class="stat"><b>${n}</b><small>${l}</small></div>`).join("");
    const max = Math.max(1, ...Object.values(c).map(v=>v.main+v.ext));
    document.getElementById("bars").innerHTML = Object.entries(c)
      .filter(([k,v]) => v.main+v.ext>0)
      .map(([k,v]) => `<div class="barrow" data-type="${esc(k)}" title="主問題 ${v.main}／延伸 ${v.ext}">
        <span>${T(k).icon} ${esc(k)}</span>
        <div class="track"><div class="bar" style="width:${v.main/max*100}%;background:${T(k).color}"></div><div class="bar ext" style="width:${v.ext/max*100}%;background:${T(k).color}"></div></div>
        <span class="n">${v.main}＋${v.ext}</span></div>`).join("");
    document.querySelectorAll(".barrow").forEach(el => el.onclick = () => setFilter(el.dataset.type));

    const types = ["全部", ...Object.keys(c).filter(k => c[k].main+c[k].ext>0)];
    document.getElementById("filters").innerHTML = types.map(t => {
      const n = t==="全部" ? qs.length : qs.filter(q=>q.type===t||(q.extensions||[]).some(e=>e.type===t)).length;
      const col = t==="全部" ? "#5b66b0" : T(t).color;
      return `<button class="chip ${active===t?"on":""}" style="--c:${col}" data-type="${esc(t)}">${t==="全部"?"":`<span class="dot" style="background:${col}"></span>`}${esc(t)}<span class="c">${n}</span></button>`;
    }).join("") + `<button class="chip ${active==="__user"?"on":""}" style="--c:#c9952b" data-type="__user">⭐ Merlin 自填<span class="c">${userQs.length}</span></button>
      <span class="tools"><button class="btn" id="expAll">全部展開</button><button class="btn gold" id="addBtn">＋ 新增問題</button></span>`;
    document.querySelectorAll(".chip").forEach(el => el.onclick = () => setFilter(el.dataset.type));
    document.getElementById("addBtn").onclick = openAdd;
    document.getElementById("expAll").onclick = toggleAll;
  }

  function matches(q){
    if (active==="全部") return true;
    if (active==="__user") return !!q.userInserted;
    return q.type===active || (q.extensions||[]).some(e=>e.type===active);
  }

  function slot(kind, url){
    const icon = kind==="video" ? "🎬" : "🖼️", name = kind==="video" ? "影片" : "圖片";
    if (!url) return `<div class="slot"><b>${icon}</b>${name}｜即將加入</div>`;
    if (kind==="image") return `<a class="slot has" href="${esc(url)}" target="_blank" rel="noopener"><img src="${esc(url)}" alt="圖片"></a>`;
    return `<a class="slot has" href="${esc(url)}" target="_blank" rel="noopener"><b>▶</b>觀看${name}</a>`;
  }

  function card(q){
    const c = T(q.type).color, s = q.source||{};
    const srcLine = s.url
      ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.who)}</a> · ${esc(s.outlet)} · ${esc(s.date)}`
      : esc([s.who,s.outlet,s.date].filter(Boolean).join(" · ") || "Merlin 自行提出");
    const exts = (q.extensions||[]);
    const highlight = e => active!=="全部"&&active!=="__user"&&e.type===active ? ` style="--c:${T(e.type).color};outline:1px solid ${T(e.type).color}"` : ` style="--c:${T(e.type).color}"`;
    return `<article class="card" id="card-${esc(q.id)}" style="--c:${c}">
      <div class="top">
        <div class="tags">${tag(q.type)}${q.userInserted?'<span class="badge-user">⭐ Merlin 自填</span>':""}<span class="idn">${exts.length} 個延伸</span></div>
        <h4>${esc(q.title)}</h4>
        <p class="one">${esc(q.oneLiner||"")}</p>
        <div class="src">📎 <span>${srcLine}</span></div>
      </div>
      <div class="mini-ext">${exts.map(e=>`<span style="--c:${T(e.type).color}" title="${esc(e.type)}"></span>`).join("")}</div>
      <button class="toggle">▼ 展開：推演流程・延伸問題</button>
      <div class="details">
        ${(q.process&&q.process.length)?`<p class="label">🧭 推演流程</p><div class="steps">${q.process.map(p=>`<div class="step"><span class="k" style="--sc:${STEP_COLORS[p.k]||"#9aa3c7"}">${esc(p.k)}</span><span class="v">${esc(p.v)}</span></div>`).join("")}</div>`:""}
        ${exts.length?`<p class="label">🔗 延伸問題</p><div class="exts">${exts.map(e=>`<div class="ext"${highlight(e)}><span class="arrow">↳</span><span>${esc(e.q)}</span>${tag(e.type)}</div>`).join("")}</div>`:""}
        <p class="label">🎞️ 媒體</p>
        <div class="media">${slot("video",q.videoUrl)}${slot("image",q.imageUrl)}</div>
        ${(s.also&&s.also.length)?`<div class="also">其他來源：${s.also.map(a=>`<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.label)}</a>`).join("、")}</div>`:""}
        ${q.userInserted&&String(q.id).startsWith("u")?`<div style="margin-top:10px;text-align:right"><button class="btn del" data-id="${esc(q.id)}">刪除此自填問題</button></div>`:""}
      </div>
    </article>`;
  }

  function renderBody(){
    const qs = all().filter(matches);
    document.getElementById("shown").textContent = `顯示 ${qs.length} / ${all().length}` + (active!=="全部" ? `｜篩選：${active==="__user"?"Merlin 自填":active}（含延伸問題符合者）` : "");
    const grid = document.getElementById("grid");
    grid.innerHTML = qs.length ? qs.map(card).join("") : `<div class="empty">這個類型目前還沒有問題。</div>`;
    grid.querySelectorAll(".card").forEach(el => {
      el.querySelector(".toggle").onclick = () => {
        el.classList.toggle("open");
        el.querySelector(".toggle").textContent = el.classList.contains("open") ? "▲ 收合" : "▼ 展開：推演流程・延伸問題";
      };
    });
    grid.querySelectorAll(".del").forEach(b => b.onclick = () => {
      userQs = userQs.filter(q => q.id !== b.dataset.id); save(); renderAll();
    });
    document.getElementById("tree").innerHTML = qs.map(q => `
      <div class="branch">
        <div class="root" style="--c:${T(q.type).color}" data-id="${esc(q.id)}">${T(q.type).icon} ${esc(q.title)}${q.userInserted?' <span class="badge-user">⭐</span>':""}<small>${esc(q.type)}${q.source&&q.source.who?" · "+esc(q.source.who.split("（")[0]):""}</small></div>
        <div class="leaves" style="--c:${T(q.type).color}">${(q.extensions||[]).map(e=>`<div class="leaf" style="--lc:${T(e.type).color}"><span class="d"></span><span>${esc(e.q)}</span><span class="t">${esc(e.type)}</span></div>`).join("") || '<div class="leaf" style="--lc:#555">（尚無延伸問題）</div>'}</div>
      </div>`).join("");
    document.querySelectorAll(".root").forEach(r => r.onclick = () => {
      const c = document.getElementById("card-"+r.dataset.id);
      if (c){ if(!c.classList.contains("open")) c.querySelector(".toggle").click(); c.scrollIntoView({behavior:"smooth",block:"center"}); }
    });
  }

  function setFilter(t){ active = (active===t && t!=="全部") ? "全部" : t; renderAll(); }
  function toggleAll(){
    const cards = [...document.querySelectorAll(".card")];
    const open = cards.some(c=>!c.classList.contains("open"));
    cards.forEach(c => { if (c.classList.contains("open") !== open) c.querySelector(".toggle").click(); });
    document.getElementById("expAll").textContent = open ? "全部收合" : "全部展開";
  }
  function save(){ try { localStorage.setItem(STORE, JSON.stringify(userQs)); } catch(e){} }

  function openAdd(){
    document.getElementById("typeSel").innerHTML = Object.keys(TYPES).map(t=>`<option>${esc(t)}</option>`).join("");
    const d = document.getElementById("addDlg");
    if (d.showModal) d.showModal();
  }
  document.getElementById("addDlg").addEventListener("close", () => {
    const d = document.getElementById("addDlg"), F = document.getElementById("addForm"), f = F.elements;
    if (d.returnValue === "ok" && f.title.value.trim()){
      const exts = f.exts.value.split("\n").map(s=>s.trim()).filter(Boolean).slice(0,4).map(line => {
        const [q, t] = line.split(/[｜|]/).map(x=>x&&x.trim());
        return { q, type: TYPES[t] ? t : "其他" };
      });
      userQs.push({
        id: "u" + Date.now(), title: f.title.value.trim(), type: f.type.value,
        source: { who: f.src.value.trim() || "Merlin", outlet: "", date: new Date().toISOString().slice(0,10), url: f.url.value.trim(), also: [] },
        oneLiner: f.oneLiner.value.trim(), extensions: exts,
        process: [{k:"問題定義",v:"（待補）"},{k:"前提",v:"（待補）"},{k:"推演",v:"（待補）"},{k:"未解關鍵點",v:"（待補）"}],
        userInserted: true, videoUrl: "", imageUrl: ""
      });
      save(); renderAll();
    }
    F.reset(); d.returnValue = "";
  });

  function renderAll(){ renderHeader(); renderBody(); }
  renderAll();
  document.body.dataset.ready = "1";
})();
</script>
</body>
</html>
