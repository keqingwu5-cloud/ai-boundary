name: First Brain Pages isolated deployment acceptance (read-only)
on:
  pull_request:
    paths:
      - tests/pilot-pages-snapshot-audit.test.mjs
      - tests/pilot-pages-webkit.test.cjs
      - .github/workflows/pilot-pages-acceptance.yml
      - docs/pilot-pages-acceptance-v03.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout PINNED public-staging snapshot (read-only)
        uses: actions/checkout@v4
        with:
          ref: 0d79eabe04db78f4b49b9dca25f952503c3e3f33
          path: audit-current
          persist-credentials: false
      - name: Checkout PINNED old snapshot, never automatically rollback
        uses: actions/checkout@v4
        with:
          ref: 03fc52e052179c0bfb1a90c42165dddd68b6ff8e
          path: audit-previous
          persist-credentials: false
      - name: Verify exact version SHAs and run static gates
        run: |
          test "$(git -C audit-current rev-parse HEAD)" = 0d79eabe04db78f4b49b9dca25f952503c3e3f33
          test "$(git -C audit-previous rev-parse HEAD)" = 03fc52e052179c0bfb1a90c42165dddd68b6ff8e
          node --test tests/pilot-pages-snapshot-audit.test.mjs
  webkit-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only checkout of the EXACT gh-pages release
        uses: actions/checkout@v4
        with:
          ref: 0d79eabe04db78f4b49b9dca25f952503c3e3f33
          path: audit-current
          persist-credentials: false
      - name: Install WebKit emulator
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: Start offline synthetic static site
        run: |
          python3 -m http.server 8845 --bind 127.0.0.1 --directory audit-current >/tmp/firstbrain-pages-audit.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8845/preview/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify simulated iPhone width with REAL WebKit engine (NOT device Safari)
        run: node --test tests/pilot-pages-webkit.test.cjs
  public-pages-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe PUBLIC URL without claiming that GitHub Pages was enabled
        shell: bash
        run: |
          set +e
          URL="https://keqingwu5-cloud.github.io/ai-boundary/preview/index.html"
          HTTP="$(curl --location --silent --show-error --connect-timeout 8 --max-time 20 --output /tmp/pilot-live.html --write-out '%{http_code}' "$URL")"
          CURL_RESULT=$?
          echo "PUBLIC_URL=$URL"
          echo "CURL_EXIT=$CURL_RESULT HTTP_STATUS=$HTTP"
          if [ "$CURL_RESULT" -eq 0 ] && [ "$HTTP" = "200" ] && grep -Fq "留空不等於 0" /tmp/pilot-live.html && grep -Fq "FIRST BRAIN" /tmp/pilot-live.html; then
            echo "PUBLIC_SITE_STATUS=HTML_V02_RETRIEVABLE"
            echo "PASS: publicly retrievable V0.2 HTML; NO claim of functional Safari/E2E"
            echo "PUBLIC_SITE_STATUS=HTML_V02_RETRIEVABLE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "PUBLIC_SITE_STATUS=NOT_VERIFIED_OR_NOT_ENABLED"
            echo "BLOCKED: Pages source setting / actual public routing must be checked"
            echo "PUBLIC_SITE_STATUS=NOT_VERIFIED_OR_NOT_ENABLED (HTTP=$HTTP; CURL_EXIT=$CURL_RESULT)" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
