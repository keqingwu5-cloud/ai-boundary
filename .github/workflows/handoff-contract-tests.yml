name: Handoff contract checks
on:
  pull_request:
    paths:
      - 'handoff-contract.js'
      - 'launcher.html'
      - 'tests/handoff-contract.test.cjs'
      - '.github/workflows/handoff-contract-tests.yml'
  push:
    branches:
      - 'fix/handoff-resource-identity-20261019'
    paths:
      - 'handoff-contract.js'
      - 'launcher.html'
      - 'tests/handoff-contract.test.cjs'
      - '.github/workflows/handoff-contract-tests.yml'
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Handoff contract tests
        run: node --test tests/handoff-contract.test.cjs
      - name: Existing launcher tests
        run: node --test tests/launcher-memory.test.cjs
