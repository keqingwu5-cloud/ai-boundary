name: Memory first-batch candidate regression
on:
  push:
    branches:
      - candidate/memory-first-batch-restore-evidence-20261023
  pull_request:
    paths:
      - "memory*.js"
      - "memory.html"
      - "tests/memory*.test.cjs"
      - ".github/workflows/memory-first-batch-candidate.yml"
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check memory.js
          node --check memory-controls-core.js
          node --check memory-workflow-core.js
          node --check memory-impact-core.js
      - name: Existing and new isolated regression
        run: |
          node --test tests/memory-controls-core.test.cjs tests/memory-workflow-core.test.cjs tests/memory-first-batch-safe-restore.test.cjs tests/memory-impact-core.test.cjs
