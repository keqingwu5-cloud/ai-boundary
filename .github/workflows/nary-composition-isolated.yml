name: N-ary composition isolated candidate
on:
  pull_request:
    paths:
      - nary-composition.mjs
      - tests/nary-composition.test.mjs
      - docs/nary-composition-protocol-v14.md
      - schemas/nary-composition.preview.schema.json
      - .github/workflows/nary-composition-isolated.yml
  workflow_dispatch:
jobs:
  generic-composition:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate N-ary candidate and basic schema syntax
        run: |
          python3 -m json.tool schemas/nary-composition.preview.schema.json > /dev/null
          node --check nary-composition.mjs
          node --test tests/nary-composition.test.mjs