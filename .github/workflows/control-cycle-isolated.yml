name: First Brain trusted control and expandable kernel (isolated)
on:
  pull_request:
    paths:
      - control-cycle-candidate.mjs
      - proof-audit-candidate.mjs
      - progress-journal-candidate.mjs
      - scripts/export-proof-audit-synthetic.mjs
      - tests/control-cycle-candidate.test.mjs
      - tests/control-cycle-flags-schema.test.mjs
      - tests/proof-audit-candidate.test.mjs
      - tests/proof-audit-schema.test.mjs
      - tests/progress-journal-candidate.test.mjs
      - tests/progress-journal-schema.test.mjs
      - schemas/control-cycle-flags.preview.schema.json
      - schemas/proof-audit.preview.schema.json
      - schemas/progress-journal.preview.schema.json
      - docs/trusted-control-cycle-contract-v01.md
      - docs/open-ended-expansion-foundation-v01.md
      - docs/proof-bundle-audit-logging-v01.md
      - docs/progress-journal-and-folders-v01.md
      - logs/README.md
      - .github/workflows/control-cycle-isolated.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-control-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source syntax and machine-readable flags
        run: |
          node --check control-cycle-candidate.mjs
          node --check proof-audit-candidate.mjs
          node --check progress-journal-candidate.mjs
          node --check scripts/export-proof-audit-synthetic.mjs
          python3 -m json.tool schemas/control-cycle-flags.preview.schema.json > /dev/null
          python3 -m json.tool schemas/proof-audit.preview.schema.json > /dev/null
          python3 -m json.tool schemas/progress-journal.preview.schema.json > /dev/null
      - name: Run original V1.4/V1.5/V1.6 regression AND control-cycle tests
        run: |
          node --test tests/nary-composition.test.mjs tests/nary-transform.test.mjs tests/nary-transform-schema.test.mjs tests/gap-aware-composition.test.mjs tests/gap-aware-schema.test.mjs tests/control-cycle-candidate.test.mjs tests/control-cycle-flags-schema.test.mjs tests/proof-audit-candidate.test.mjs tests/proof-audit-schema.test.mjs tests/progress-journal-candidate.test.mjs tests/progress-journal-schema.test.mjs
      - name: Confirm no production network, credentials, database or writes
        shell: bash
        run: |
          test -f control-cycle-candidate.mjs
          test ! -f .env
          ! grep -E '(node:fs|node:net|node:http|fetch\(|localStorage|indexedDB|process\.env|postgres|createServer|setInterval)' control-cycle-candidate.mjs proof-audit-candidate.mjs progress-journal-candidate.mjs
          echo 'ISOLATED_ONLY: no runtime external IO in new control module'
      - name: Generate five proof packets and 20 dated stream logs in folders (synthetic, HOLD)
        run: node scripts/export-proof-audit-synthetic.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: firstbrain-proof-and-progress-folder-examples
          path: artifacts/proof-audit-synthetic
          retention-days: 14
