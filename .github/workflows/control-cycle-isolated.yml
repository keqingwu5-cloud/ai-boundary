name: First Brain trusted control and expandable kernel (isolated)
on:
  pull_request:
    paths:
      - control-cycle-candidate.mjs
      - tests/control-cycle-candidate.test.mjs
      - tests/control-cycle-engine-quarantine.test.mjs
      - tests/control-cycle-flags-schema.test.mjs
      - schemas/control-cycle-flags.preview.schema.json
      - docs/trusted-control-cycle-contract-v01.md
      - docs/open-ended-expansion-foundation-v01.md
      - .github/workflows/control-cycle-isolated.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-control-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert pinned source HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source syntax and machine-readable flags
        run: |
          node --check control-cycle-candidate.mjs
          python3 -m json.tool schemas/control-cycle-flags.preview.schema.json > /dev/null
      - name: Run original V1.4/V1.5/V1.6 regression AND control-cycle tests
        run: |
          node --test tests/nary-composition.test.mjs tests/nary-transform.test.mjs tests/nary-transform-schema.test.mjs tests/gap-aware-composition.test.mjs tests/gap-aware-schema.test.mjs tests/control-cycle-candidate.test.mjs tests/control-cycle-flags-schema.test.mjs tests/control-cycle-engine-quarantine.test.mjs
      - name: Confirm no production network, credentials, database or writes
        shell: bash
        run: |
          test -f control-cycle-candidate.mjs
          test ! -f .env
          ! grep -E '(node:fs|node:net|node:http|fetch\(|localStorage|indexedDB|process\.env|postgres|createServer|setInterval)' control-cycle-candidate.mjs
          echo 'ISOLATED_ONLY: no runtime external IO in new control module'
