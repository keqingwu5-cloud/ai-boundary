name: Mainbrain API candidate tests
on:
  pull_request:
    paths:
      - 'api/**'
      - 'tests/mainbrain-*.test.cjs'
      - 'tests/handoff-contract.test.cjs'
      - 'tests/handoff-*.test.cjs'
      - 'tests/task-locator-*.test.cjs'
      - 'tests/task-source-summary.test.cjs'
      - 'tests/task-source-checkpoint.test.cjs'
      - 'tests/launcher-memory.test.cjs'
      - 'tests/memory-workflow-core.test.cjs'
      - 'docs/mainbrain-api-*.md'
      - '.github/workflows/mainbrain-api-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: API candidate and HTTP authentication tests
        run: node --test tests/mainbrain-api.test.cjs tests/mainbrain-auth-http.test.cjs tests/mainbrain-http-path-id-guard.test.cjs tests/mainbrain-persistence-candidate.test.cjs tests/mainbrain-revocation-candidate.test.cjs
      - name: Existing handoff and launcher regression tests
        run: node --test tests/handoff-contract.test.cjs tests/launcher-memory.test.cjs tests/memory-workflow-core.test.cjs
      - name: Bidirectional and multimodal handoff self-review regressions
        run: node --test tests/handoff-mutual-review-candidate.test.cjs tests/handoff-multimodal-contract-candidate.test.cjs tests/task-locator-candidate.test.cjs tests/task-locator-github-adapter.test.cjs tests/task-source-summary.test.cjs tests/task-source-checkpoint.test.cjs
      - name: Read public GitHub Issue 41 through actual REST source (no external agent ACK)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: keqingwu5-cloud/ai-boundary
        run: node api/task-locator-github-adapter.cjs 41
      - name: Discover public Issue 41 by GitHub search without a supplied task number
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: keqingwu5-cloud/ai-boundary
        run: node api/task-locator-github-adapter.cjs '--query=in:title "共用交接入口"' --expect=41
      - name: Restore prior complete-source cursor (cache is best effort)
        id: restore_cursor
        uses: actions/cache/restore@v4
        with:
          path: bridge-evidence/source-cursor.json
          key: firstbrain-source-v1-pr${{ github.event.pull_request.number || 'manual' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            firstbrain-source-v1-pr${{ github.event.pull_request.number || 'manual' }}-
      - name: Compare current public Issue 41 with last successful source cursor
        id: cursor
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: keqingwu5-cloud/ai-boundary
          BRIDGE_SOURCE_ISSUE: '41'
        run: node api/task-source-checkpoint.cjs
      - name: Cache cursor only after a complete changed read
        if: ${{ success() && steps.cursor.outputs.checkpoint_written == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: bridge-evidence/source-cursor.json
          key: firstbrain-source-v1-pr${{ github.event.pull_request.number || 'manual' }}-${{ github.run_id }}-${{ github.run_attempt }}
