name: Mainbrain API candidate tests
on:
  pull_request:
    paths:
      - 'api/**'
      - 'tests/mainbrain-api.test.cjs'
      - 'docs/mainbrain-api-v0.1.md'
      - '.github/workflows/mainbrain-api-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: API candidate tests
        run: node --test tests/mainbrain-api.test.cjs
      - name: Existing handoff and launcher regression tests
        run: node --test tests/handoff-contract.test.cjs tests/launcher-memory.test.cjs tests/memory-workflow-core.test.cjs
