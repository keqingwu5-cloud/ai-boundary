# Adapted from fix/r19-webkit-wait-journal-events (.github/workflows/brain-import-integrity.yml).
# Minimal change: run Node unit + L1 negative tests for first-brain-plan-core (16 tests).
# Chromium / WebKit Playwright jobs from r19 do NOT apply here (no browser tests in this PR).
name: PR86 L1 plan integrity (isolated)
on:
  pull_request:
    paths:
      - first-brain-plan-core.js
      - tests/first-brain-plan-core.test.cjs
      - tests/first-brain-plan-core-l1-negative.test.cjs
      - .github/workflows/pr86-l1-plan-integrity.yml
jobs:
  node-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run plan-core unit + L1 negative (16 tests)
        run: node --test tests/first-brain-plan-core.test.cjs tests/first-brain-plan-core-l1-negative.test.cjs
