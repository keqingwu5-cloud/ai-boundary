name: Brain local storage guard isolated candidate
on:
  pull_request:
    paths:
      - 'app.js'
      - 'brain-storage-guard.mjs'
      - 'brain-graph-integrity.mjs'
      - 'api/auto-review-router.cjs'
      - 'api/source-baseline-attestation.cjs'
      - 'api/f05-attested-interface-bridge.cjs'
      - 'docs/source-baseline-attestation-candidate-v0.1.md'
      - 'vendor/fast-json-stable-stringify-v2.1.0.cjs'
      - 'vendor/LICENSE-fast-json-stable-stringify.txt'
      - 'docs/auto-review-router-candidate-v0.1.md'
      - 'tests/brain-storage-guard.test.cjs'
      - 'tests/brain-graph-integrity.test.cjs'
      - 'tests/auto-review-router.test.cjs'
      - 'tests/auto-review-efficacy.test.cjs'
      - 'tests/source-baseline-attestation.test.cjs'
      - 'tests/f05-attested-interface-bridge.test.cjs'
      - '.github/workflows/brain-storage-guard-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Candidate storage guard and existing memory regression
        run: node --test tests/brain-storage-guard.test.cjs tests/brain-graph-integrity.test.cjs tests/auto-review-router.test.cjs tests/auto-review-efficacy.test.cjs tests/source-baseline-attestation.test.cjs tests/f05-attested-interface-bridge.test.cjs tests/launcher-memory.test.cjs tests/memory-workflow-core.test.cjs
      - name: Verify independent ESM guard parses
        run: node --check brain-storage-guard.mjs && node --check brain-graph-integrity.mjs && node --check api/auto-review-router.cjs && node --check api/source-baseline-attestation.cjs && node --check api/f05-attested-interface-bridge.cjs && node --check vendor/fast-json-stable-stringify-v2.1.0.cjs
