name: Mainbrain isolated PostgreSQL integration
on:
  pull_request:
    paths:
      - 'api/**'
      - 'tests/mainbrain-pg-integration.test.cjs'
      - '.github/workflows/mainbrain-pg-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: mainbrain_candidate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mainbrain_candidate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MAINBRAIN_TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/mainbrain_candidate_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL test driver only
        run: npm install --no-save --no-package-lock --ignore-scripts pg@8.16.3
      - name: PostgreSQL service integration and regression tests
        run: node --test tests/mainbrain-pg-integration.test.cjs
