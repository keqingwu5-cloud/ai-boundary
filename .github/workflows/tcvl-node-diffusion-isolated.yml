name: Node diffusion isolated tests
on:
  push:
    branches: [fix/node-diffusion-p1-gates-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check candidate syntax
        run: |
          node --check tcvl-node-diffusion-core.js
          node --check tcvl-diffusion-bridge.js
      - name: P1 gates and replay counterexamples
        run: node --test tests/tcvl-node-diffusion-core.test.cjs tests/tcvl-diffusion-bridge.test.cjs
      - name: All existing TCVL Node regressions
        run: node --test tests/*.test.cjs
