name: First Brain evidence feedback browser
on:
  push:
    branches:
      - test/fb86-evidence-feedback-20261105
    paths:
      - .github/workflows/first-brain-evidence-feedback-browser.yml
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record source and prepare Chrome
        run: |
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/checkpoint.txt
          google-chrome --version | tee -a evidence/checkpoint.txt
          timeout --kill-after=3s 60s npm install --no-save --package-lock=false --fetch-retries=0 playwright-core@1.56.1
      - name: Run one browser feedback case
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > evidence/http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          curl --fail --silent --max-time 3 http://127.0.0.1:8765/memory.html -o /dev/null
          printf 'case=evidence_feedback attempt=1 limit_seconds=60\n' | tee -a evidence/checkpoint.txt
          set +e
          timeout --kill-after=3s 60s node --test --test-reporter=tap tests/first-brain-evidence-feedback-browser.test.cjs | tee evidence/probe.tap
          result=${PIPESTATUS[0]}
          printf 'exit_code=%s\n' "$result" | tee -a evidence/checkpoint.txt
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-brain-evidence-feedback-browser
          path: evidence/
          retention-days: 7
