name: First Brain minimal isolated pilot (synthetic, no deploy)
on:
  pull_request:
    paths:
      - preview/index.html
      - preview/app.mjs
      - preview/pilot-core.mjs
      - tests/pilot-core.test.mjs
      - tests/pilot-release-review.test.mjs
      - tests/pilot-browser.test.cjs
      - tests/pilot-browser-review.test.cjs
      - docs/minimal-isolated-pilot-v01.md
      - docs/pilot-review-gates-v02.md
      - .github/workflows/first-brain-minimal-isolated-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and minimal pilot plus V1.4-V1.6 regression
        run: |
          node --check preview/pilot-core.mjs
          node --check preview/app.mjs
          node --test tests/nary-composition.test.mjs tests/nary-transform.test.mjs tests/nary-transform-schema.test.mjs tests/gap-aware-composition.test.mjs tests/gap-aware-schema.test.mjs tests/pilot-core.test.mjs tests/pilot-release-review.test.mjs
      - name: Upload isolated static preview (not production deploy)
        uses: actions/upload-artifact@v4
        with:
          name: first-brain-isolated-pilot-preview
          path: |
            preview/index.html
            preview/app.mjs
            preview/pilot-core.mjs
            gap-aware-composition.mjs
            nary-transform.mjs
            nary-composition.mjs
          retention-days: 14
  chromium-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: npm install --no-save --package-lock=false playwright-core@1.56.1
      - name: Confirm browser available
        run: google-chrome --version
      - name: Start isolated static preview server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/brain-pilot.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/preview/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run Chromium true-browser interactions
        run: node --test tests/pilot-browser.test.cjs tests/pilot-browser-review.test.cjs