<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>第一大腦｜2D 樹狀研究預覽（唯讀）</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;color:#f0f1ff;background:#080c1c;--muted:#a3afca;--line:#34415f;--panel:#131a30;--glass:#171f39}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 22% 4%,#253057 0,transparent 49%),#080c1c}
button,input,a{font:inherit}
button{cursor:pointer}
a{color:#b5c9ff}
.skip{position:absolute;left:-999px;top:0;background:#fff;color:#000;padding:8px;z-index:10}
.skip:focus{left:12px}
header{border-bottom:1px solid var(--line);background:#0e1529cc;backdrop-filter:blur(12px);position:sticky;top:0;z-index:5}
.wrap{max-width:1300px;margin:auto;padding:0 18px}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:16px 0}
h1{font-size:20px;letter-spacing:.02em;margin:0}
.kicker{color:#a6bbff;font-size:11px;letter-spacing:.13em;font-weight:700}
.sub{margin:4px 0;color:var(--muted);font-size:12px}
.toplinks{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.button,.toplinks a{color:#e4e9ff;background:#1c2744;border:1px solid #3b4d78;border-radius:12px;padding:10px 12px;text-decoration:none;font-size:12px}
.button:hover,.toplinks a:hover,.node-button:hover{border-color:#91b3fb;background:#28365e}
.notice{margin:14px 0;border:1px solid #615641;background:#2f291e;border-radius:12px;padding:10px 13px;color:#ebdcb6;font-size:12px}
.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:16px;align-items:start;margin-bottom:40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:19px;box-shadow:0 14px 30px #0002;min-width:0}
.cardhead{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
h2{margin:0;font-size:16px}
.count{font-size:12px;color:var(--muted)}
.controls{display:flex;gap:9px;padding:14px 18px 4px;flex-wrap:wrap}
.controls label{font-size:12px;color:var(--muted);display:block;width:100%}
input[type=search]{min-width:160px;flex:1;background:#080f22;color:#fff;padding:11px 12px;border:1px solid #45547b;border-radius:11px}
input:focus,button:focus-visible,a:focus-visible{outline:2px solid #b4d3ff;outline-offset:2px}
.help{color:var(--muted);font-size:12px;margin:8px 18px 10px}
#tree{padding:0 18px 20px;overflow-wrap:anywhere}
#tree ul{list-style:none;padding-left:19px;margin:5px 0 0;border-left:1px solid #3b4969}
#tree>ul{padding-left:0;border-left:none}
#tree li{margin:5px 0}
.brain-entry{padding:10px 0;border-bottom:1px solid #263454}
.brain-summary{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brain-icon{display:inline-grid;place-items:center;width:28px;height:28px;background:#283e70;border-radius:9px}
.brain-meta{font-size:11px;color:var(--muted);font-weight:400}
.tree-row{display:flex;gap:6px;align-items:center;min-width:0}
.toggle{background:transparent;border:1px solid #415074;color:#baccfa;border-radius:8px;width:28px;height:28px;flex:none}
.toggle:disabled{opacity:.15;cursor:default}
.node-button{border:1px solid transparent;background:#1a2541;color:#eaf0ff;text-align:left;border-radius:9px;padding:9px 11px;min-width:0;flex:1;font-size:13px;line-height:1.5;word-break:break-word}
.node-button[aria-current=true]{background:#2f436e;border-color:#a4befd}
.node-marker{font-size:11px;opacity:.7;margin-right:5px}
#detail{padding:18px;min-height:260px;overflow-wrap:anywhere}
#detail h3{font-size:19px;line-height:1.4;margin:8px 0 12px}
.field{margin:13px 0;padding-top:10px;border-top:1px solid #293454}
.field dt{font-size:11px;color:var(--muted);margin-bottom:5px}
.field dd{margin:0;font-size:13px;white-space:pre-wrap;line-height:1.65}
.pill{font-size:11px;color:#b9d4fb;border-radius:99px;border:1px solid #5474a5;padding:3px 8px;display:inline-block}
.warn{border:1px solid #67503f;background:#302219;border-radius:10px;padding:10px;font-size:12px;color:#f1cfaf;margin-top:10px}
.empty{color:var(--muted);font-size:13px;line-height:1.7}
.small{font-size:11px;color:var(--muted);line-height:1.6}
#errors{padding:10px 18px 18px;font-size:12px;color:#f1c8a7}
#errors:empty{display:none}
#status{color:var(--muted);font-size:12px;margin:0;padding:10px 18px}
#status[data-error=true]{color:#ffbea0}
@media(max-width:820px){.layout{grid-template-columns:1fr}.top{align-items:flex-start}#detail{min-height:150px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#tree">跳到樹狀圖</a>
<header><div class="wrap top">
<div><div class="kicker">FIRST BRAIN · RESEARCH VIEW V0.1</div><h1>第一大腦 · 2D 樹狀總覽</h1><p class="sub">沿用現有 3D 大腦的節點資料，不建立第二份權威紀錄</p></div>
<nav class="toplinks" aria-label="視圖導航"><a href="./index.html">↗ 返回 3D 主腦</a><a href="./world-model.html">世界模型</a><a href="./tree-view.html?demo=1">查看合成示範</a><button id="reload" class="button" type="button">重新讀取本機資料</button></nav>
</div></header>
<main class="wrap">
<div class="notice">隔離研究原型 · 唯讀。本頁預設只讀取這個瀏覽器的 <code>aiBrain.v1</code>；<code>?demo=1</code> 僅用合成資料、不讀取本機記憶。不匯入、遷移、同步或寫入記憶；不代表跨 AI 真實接收、審查或部署完成。</div>
<div class="layout">
<section class="card" aria-labelledby="tree-heading">
<div class="cardhead"><h2 id="tree-heading">主腦與子腦分支</h2><span id="counts" class="count">尚未讀取</span></div>
<div class="controls"><label for="search">搜尋節點名稱／摘要</label><input id="search" type="search" autocomplete="off" placeholder="輸入關鍵字，會展開相符路徑" aria-controls="tree"/></div>
<p class="help">點節點查看來源、研究狀態與反證數量；小箭頭可收合子問題。跨腦關係不當作父子關係。</p>
<p id="status" role="status" aria-live="polite">讀取中…</p>
<div id="tree" tabindex="-1" aria-label="唯讀樹狀導覽"></div>
<div id="errors"></div>
</section>
<aside class="card" aria-labelledby="detail-heading"><div class="cardhead"><h2 id="detail-heading">節點詳情</h2><span class="pill">唯讀</span></div><div id="detail"><p class="empty">選擇左側節點查看來源、前提與相關連結。</p></div></aside>
</div>
</main>
<script type="module" src="./tree-view.mjs"></script>
</body>
</html>
