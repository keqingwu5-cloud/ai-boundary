<script type="module">
/* Automation helpers for Playwright / second-tab protocol (does not alter product update path). */
import { JOURNAL_KEY, LEGACY_KEY, WORLD_LEDGER_WRITE_LOCK } from './vendor/world-verification-ledger.mjs';
let holdRelease = null;
window.__r19Shell = {
  ready: () => !!(window.WorldVerifyHistory && document.body.dataset.ledgerReady === '1'),
  async clear() {
    localStorage.removeItem(JOURNAL_KEY);
    localStorage.removeItem(LEGACY_KEY);
  },
  async holdLock() {
    if (!navigator.locks?.request) return { ok: false };
    window.r19Locked = false;
    const held = new Promise((resolve) => { holdRelease = resolve; });
    await new Promise((entered) => {
      navigator.locks.request(WORLD_LEDGER_WRITE_LOCK, { mode: 'exclusive' }, () => {
        window.r19Locked = true;
        entered();
        return held.then(() => { window.r19Locked = false; });
      });
    });
    return { ok: true };
  },
  releaseLock() {
    if (typeof holdRelease === 'function') { holdRelease(); holdRelease = null; }
    return { ok: true };
  },
  append: (change) => window.WorldVerifyHistory.append(change),
  view: () => window.WorldVerifyHistory.view(),
  probe() {
    const raw = localStorage.getItem(JOURNAL_KEY);
    let eventsLen = raw ? JSON.parse(raw).events.length : 0;
    return { rawIsNull: raw === null, eventsLen, locked: !!window.r19Locked };
  }
};
</script>
