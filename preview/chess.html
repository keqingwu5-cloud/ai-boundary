<style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#0b1220;color:#edf1f8}body{margin:0;padding:20px}main{max-width:760px;margin:auto}h1{font-size:1.5rem}p{color:#b9c6db}section{border:1px solid #354258;background:#172338;border-radius:14px;padding:18px;margin:14px 0}label{display:block;margin:12px 0}input,select,button{font:inherit;color:inherit;background:#25334e;border:1px solid #596882;padding:9px;border-radius:8px;max-width:100%}button{background:#246ca2;cursor:pointer}button:disabled{opacity:.6}code,li{overflow-wrap:anywhere;font-size:.82rem}pre{overflow-wrap:anywhere;white-space:pre-wrap}small{color:#b6c5d7}a{color:#9dd1ff}</style></head>
<body><main><small>FIRST BRAIN · ISOLATED / NO AUTHORITY</small><h1>世界如棋局 × N-ary｜走法溯源</h1><p>僅合成數值示範。同一個 X 可以重用，但兩條研究分支必須有不同走法 ID。這不是因果推理、真實行動、核准或 AI 接收。</p>
<section><label>來源 A（MB）<input id="a" type="number" min="0" max="1000000" step="1" value="4"></label><label>來源 B（MB）<input id="b" type="number" min="0" max="1000000" step="1" value="6"></label><label>C 的研究空白狀態<select id="c-state"><option value="UNKNOWN">未知</option><option value="MISSING">未提供</option><option value="UNVERIFIED">待驗證</option><option value="INTENTIONALLY_OPEN">刻意留白</option><option value="NOT_APPLICABLE">不適用</option></select></label><button id="run" type="button">執行唯讀隔離研究</button></section>
<section><h2 id="status" aria-live="polite">尚未執行</h2><p>固定研究棋盤 ID</p><code id="board">—</code><p>A＋B 的共用結果</p><code id="result">—</code></section>
<section><h2>不同走法事件（非實際執行）</h2><ul id="branches"></ul></section><section><h2>不可升格狀態</h2><pre id="audit">尚未執行</pre></section>
